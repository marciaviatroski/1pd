<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog Tech - Livro 80px</title>
    <style>
        body { font-family: 'Courier New', monospace; margin: 0; padding: 0; background-color: #f0f0f0; color: #333; }
        header { background-color: blue; color: white; padding: 20px; text-align: center; border-bottom: 4px solid darkblue; }
        main { max-width: 600px; margin: 20px auto; padding: 20px; background-color: white; border: 2px solid #ccc; }
        
        /* Estilo da seção do livro e Pix */
        .produto-pix {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 2px dashed #999;
            padding: 15px;
            background-color: #fafafa;
        }

        /* CONTAINER DA IMAGEM EXATAMENTE 80x80 */
        .capa-livro-80px {
            width: 80px;
            height: 80px;
            border: 2px solid #333;
            background-color: #654321; /* Cor de fundo imitando o livro antigo */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            overflow: hidden; /* Garante que nada saia dos 80x80 */
            image-rendering: pixelated; /* Melhora a aparência de imagens pequenas */
        }

        /* Imagem simulada dentro do container 80x80 */
        .capa-livro-80px img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preco { font-size: 1.2em; font-weight: bold; color: green; margin: 5px 0; }
        .codigo-pix {
            background-color: #eee;
            padding: 8px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 0.8em;
            width: 90%;
            word-wrap: break-word;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>[MINI_BLOG_TECH]</h1>
        <p>CONHECIMENTO EM PIXELS</p>
    </header>

    <main>
        <section>
            <h2>Livro: Algorítmos Mini</h2>
            <p>Uma versão micro do nosso guia prático.</p>
        </section>

        <section class="produto-pix">
            <!-- AREA DA IMAGEM 80x80 -->
            <div class="capa-livro-80px">
                <!-- Se você tiver uma imagem real de 80x80, coloque-a aqui: -->
                <!-- <img src="livro_80x80.png" alt="Mini capa do livro"> -->
                
                <!-- Simulação visual direta no CSS/HTML (opcional se não tiver a imagem) -->
                <div style="width: 60px; height: 70px; background-color: #8b4513; border: 1px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <div style="width: 40px; height: 5px; background-color: #ffd700; margin-bottom: 2px;"></div>
                    <div style="width: 30px; height: 5px; background-color: #ffd700;"></div>
                </div>
            </div>

            <p class="preco">R$ 80,00 (PIX)</p>

            <p>Escaneie o QR Code ou copie o código abaixo:</p>
            
            <!-- Imagem do QR Code (substitua pelo seu arquivo real) -->
            <img src="qrcode_exemplo.png" alt="QR Code Pix" style="width: 150px; height: 150px; border: 1px solid #ccc;">

            <textarea class="codigo-pix" rows="4" readonly>00020101021126580014br.gov.bcb.pix0136SEU_CHAVE_PIX_AQUI520400005303986540580.005802BR5913SEU_NOME_AQUI6009CURITIBA62070503***6304ABCD</textarea>
        </section>
    </main>

</body>
</html>
